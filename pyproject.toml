[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-mamba-inference"
version = "0.3.0"
description = "Pretrained AD-Mamba audio classification"
requires-python = ">=3.10"
dependencies = ["torch>=2.0,<2.9", "torchaudio>=2.0.1,<2.9", "numpy>=1.23,<2", "soundfile>=0.13.1"]

[tool.setuptools]
packages = ["ad_mamba"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
ad_mamba = ["class_labels_indices.csv"]
